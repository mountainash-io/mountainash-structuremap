name: Foundation

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-tests:
    name: foundation-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: mountainash-io
          repositories: mountainash
          permission-contents: read
      - name: Run tests
        env:
          CI_READ_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${CI_READ_TOKEN}@github.com/mountainash-io/mountainash.git".insteadOf https://github.com/mountainash-io/mountainash.git
          python -m pip install "hatch>=1.14"
          hatch run test:test
          hatch run test:python examples/pydantic_roundtrip.py
          hatch run test:python examples/composable_mapping.py

  foundation-wheel:
    name: foundation-wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: mountainash-io
          repositories: mountainash
          permission-contents: read
      - name: Qualify installed wheel
        env:
          CI_READ_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${CI_READ_TOKEN}@github.com/mountainash-io/mountainash.git".insteadOf https://github.com/mountainash-io/mountainash.git
          python -m pip install "hatch>=1.14"
          hatch run test:wheel-smoke

  foundation-lint:
    name: foundation-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "hatch>=1.14"
      - run: hatch run ruff:check

  foundation-types:
    name: foundation-types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: mountainash-io
          repositories: mountainash
          permission-contents: read
      - name: Check types
        env:
          CI_READ_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${CI_READ_TOKEN}@github.com/mountainash-io/mountainash.git".insteadOf https://github.com/mountainash-io/mountainash.git
          python -m pip install "hatch>=1.14"
          hatch run mypy:check
