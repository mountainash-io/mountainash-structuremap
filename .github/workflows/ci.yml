name: Foundation

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-tests:
    name: foundation-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: mountainash-io
          repositories: mountainash
          permission-contents: read
      - name: Checkout pinned Mountainash
        uses: actions/checkout@v4
        with:
          repository: mountainash-io/mountainash
          ref: c98f35ace19562dac0612fdd9f6c580a59bdc5f8
          token: ${{ steps.app-token.outputs.token }}
          path: temp/mountainash
      - name: Run tests
        env:
          MOUNTAINASH_SOURCE_URI: file://${{ github.workspace }}/temp/mountainash
        run: |
          python -m pip install hatch
          hatch run test:test

  foundation-wheel:
    name: foundation-wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: mountainash-io
          repositories: mountainash
          permission-contents: read
      - name: Checkout pinned Mountainash
        uses: actions/checkout@v4
        with:
          repository: mountainash-io/mountainash
          ref: c98f35ace19562dac0612fdd9f6c580a59bdc5f8
          token: ${{ steps.app-token.outputs.token }}
          path: temp/mountainash
      - name: Install Hatch
        run: python -m pip install hatch
      - name: Qualify installed wheel
        env:
          MOUNTAINASH_SOURCE_URI: file://${{ github.workspace }}/temp/mountainash
        run: hatch run test:wheel-smoke

  foundation-lint:
    name: foundation-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install hatch
      - run: hatch run ruff:check

  foundation-types:
    name: foundation-types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: mountainash-io
          repositories: mountainash
          permission-contents: read
      - name: Checkout pinned Mountainash
        uses: actions/checkout@v4
        with:
          repository: mountainash-io/mountainash
          ref: c98f35ace19562dac0612fdd9f6c580a59bdc5f8
          token: ${{ steps.app-token.outputs.token }}
          path: temp/mountainash
      - name: Install Hatch
        run: python -m pip install hatch
      - name: Check types
        env:
          MOUNTAINASH_SOURCE_URI: file://${{ github.workspace }}/temp/mountainash
        run: hatch run mypy:check
