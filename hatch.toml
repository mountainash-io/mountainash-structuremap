
[envs.test]
python = "3.12"
installer = "uv"
skip-install = false
features = ["xml"]
dependencies = [
  "pytest>=8",
  "hatch>=1.14",
  "jsonschema>=4,<5",
]

[envs.test.scripts]
test-target-quick = "pytest {args}"
test = "pytest tests"
wheel-smoke = "python tests/support/wheel_smoke.py"

[envs.ruff]
python = "3.12"
installer = "uv"
skip-install = true
dependencies = ["ruff"]

[envs.ruff.scripts]
check = "ruff check src tests examples"


[envs.mypy]
python = "3.12"
installer = "uv"
skip-install = false
features = ["xml"]
dependencies = ["mypy", "types-PyYAML"]

[envs.mypy.scripts]
check = "mypy src/mountainash_structuremap"
