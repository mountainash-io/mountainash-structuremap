[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mountainash-structuremap"
version = "0.1.0.dev0"
description = "Declarative native-model and table transformations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mountainash @ git+https://github.com/mountainash-io/mountainash.git@dcf43a81a4f2ddebce2b0550f0a26b015f8290f7",
  "pydantic>=2.11,<3",
  "PyYAML>=6,<7",
  "pyarrow>=16",
]

[project.optional-dependencies]
xml = ["xsdata==26.2", "lxml>=4.9"]
files = [
  "mountainash-files @ git+https://github.com/mountainash-io/mountainash-files.git@82a740903dcd262c5f273d99e2e79dc2891938bf",
  "mountainash-transport @ git+https://github.com/mountainash-io/mountainash-transport.git@038f7517691c7b0e80b6dea5202683061f18259a",
  "mountainash-auth-client @ git+https://github.com/mountainash-io/mountainash-auth-client.git@1b57247f17deb68c1178635486c05a8bfc6fa83b",
  "mountainash-settings @ git+https://github.com/mountainash-io/mountainash-settings.git@1bb25f741459c491280d7d9cacf7ebf3a8b66cf3",
]


[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mountainash_structuremap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["mountainash", "mountainash.*"]
# Analyze dependency source even though Mountainash does not ship py.typed.
follow_untyped_imports = true
