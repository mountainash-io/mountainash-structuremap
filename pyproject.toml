[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mountainash-structuremap"
version = "0.1.0.dev0"
description = "Declarative native-model and table transformations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mountainash @ git+https://github.com/mountainash-io/mountainash.git@c98f35ace19562dac0612fdd9f6c580a59bdc5f8",
  "pydantic>=2.5,<3",
]

[project.optional-dependencies]
xml = ["xsdata==26.2"]


[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mountainash_structuremap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["mountainash", "mountainash.*"]
# Analyze dependency source even though Mountainash does not ship py.typed.
follow_untyped_imports = true
